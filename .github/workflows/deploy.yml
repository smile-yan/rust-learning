name: Deploy frontend on tag

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build static files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Build and package
        env:
          EVALUATE_URL: ${{ secrets.EVALUATE_URL }}
        run: |
          chmod +x scripts/build-frontend.sh
          scripts/build-frontend.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist-frontend.tar.gz
          if-no-files-found: error

  deploy:
    name: Upload and deploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist

      - name: Deploy frontend
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          FRONTEND_HOST: ${{ secrets.FRONTEND_HOST }}
          FRONTEND_USER: ${{ secrets.FRONTEND_USER }}
          FRONTEND_WEB_ROOT: ${{ secrets.FRONTEND_WEB_ROOT }}
        run: |
          chmod +x scripts/deploy-frontend.sh
          scripts/deploy-frontend.sh dist-frontend.tar.gz
