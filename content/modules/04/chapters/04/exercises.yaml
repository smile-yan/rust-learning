- title: 用 ? 传播错误
  description: 实现 parse_number 并用 ? 在 compute 中传播。
  code_template: |-
    fn parse_number(s: &str) -> Result<i32, std::num::ParseIntError> {
        s.parse()
    }

    fn compute(s: &str) -> Result<i32, std::num::ParseIntError> {
        let n = parse_number(s)?;
        Ok(n * 2)
    }

    fn main() {
        println!("{:?}", compute("10"));
    }
