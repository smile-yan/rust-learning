- title: 封装与多态
  description: 定义 BankAccount 封装 balance，并用 trait 实现多态。
  code_template: |-
    struct BankAccount { balance: f64 }

    impl BankAccount {
        fn deposit(&mut self, amount: f64) { self.balance += amount; }
        fn balance(&self) -> f64 { self.balance }
    }

    fn main() {
        let mut acc = BankAccount { balance: 0.0 };
        acc.deposit(100.0);
        println!("{}", acc.balance());
    }
