- title: Greetable trait
  description: 定义 Greetable trait 含 greet 方法，为 Person 实现。
  code_template: |-
    trait Greetable {
        fn greet(&self);
    }

    struct Person { name: String }

    impl Greetable for Person {
        fn greet(&self) {
            println!("Hello, {}!", self.name);
        }
    }

    fn main() {
        Person { name: String::from("Bob") }.greet();
    }
