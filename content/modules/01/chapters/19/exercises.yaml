- title: 计时循环
  description: 用 Instant 测量 1..=1_000_000 循环的耗时并打印。
  code_template: |-
    use std::time::Instant;

    fn main() {
        let start = Instant::now();
        let mut sum = 0u64;
        for i in 1..=1_000_000 { sum += i; }
        println!("sum={} time={:?}", sum, start.elapsed());
    }
