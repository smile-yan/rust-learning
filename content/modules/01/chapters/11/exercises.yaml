- title: 计算器 CLI
  description: 用 clap 定义一个 calc 程序，接受 add <a> <b> 子命令并打印结果。
  code_template: |
    use clap::{Parser, Subcommand};

    #[derive(Parser)]
    struct Cli {
        #[command(subcommand)]
        command: Commands,
    }

    #[derive(Subcommand)]
    enum Commands { Add { a: i32, b: i32 } }

    fn main() {}
