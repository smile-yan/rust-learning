- title: 为 add 写单元测试
  description: '在 #[cfg(test)] mod tests 中为 add 函数写 assert_eq! 测试。'
  code_template: |-
    fn add(a: i32, b: i32) -> i32 { a + b }

    #[cfg(test)]
    mod tests {
        use super::*;

        #[test]
        fn it_adds() {
            assert_eq!(add(2, 3), 5);
        }
    }

    fn main() {}
