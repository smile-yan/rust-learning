- title: 泛型交换函数
  description: '实现 swap<T>(a: T, b: T) -> (T, T)，返回交换后的元组。'
  code_template: |-
    fn swap<T>(a: T, b: T) -> (T, T) {
        (b, a)
    }

    fn main() {
        println!("{:?}", swap(1, 2));
        println!("{:?}", swap("a", "b"));
    }
- title: 泛型结构体点
  description: '定义 Point<T> { x: T, y: T }，并输出坐标。'
  code_template: |-
    struct Point<T> {
        x: T,
        y: T,
    }

    fn main() {
        let p = Point { x: 1.0, y: 2.0 };
        println!("({}, {})", p.x, p.y);
    }
