- title: 用 Box 装箱整数
  description: 创建一个 Box<i32> 并打印其中值。
  code_template: |-
    fn main() {
        let b = Box::new(42);
        println!("{}", b);
    }
- title: Rc 共享 Vec
  description: 用 Rc::new 共享一个 Vec，clone 两次并打印引用计数。
  code_template: |-
    use std::rc::Rc;

    fn main() {
        let v = Rc::new(vec![1, 2, 3]);
        let _v2 = Rc::clone(&v);
        let _v3 = Rc::clone(&v);
        println!("{}", Rc::strong_count(&v));
    }
