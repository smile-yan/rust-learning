- title: 用 anyhow 传播错误
  description: 写一个返回 anyhow::Result 的函数，使用 ? 和 .context()。
  code_template: |-
    use anyhow::Result;

    fn read_config(path: &str) -> Result<String> {
        std::fs::read_to_string(path)
            .context("读取配置失败")
    }

    fn main() -> Result<()> {
        let s = read_config("config.toml")?;
        println!("{}", s.len());
        Ok(())
    }
