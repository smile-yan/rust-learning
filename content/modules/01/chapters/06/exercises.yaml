- title: spawn 打印数字
  description: 用 thread::spawn 启动一个线程打印 1 到 3，主线程等待其结束。
  code_template: |-
    use std::thread;

    fn main() {
        let handle = thread::spawn(|| {
            for i in 1..=3 {
                println!("{}", i);
            }
        });
        handle.join().unwrap();
    }
- title: mpsc 发送消息
  description: 用 channel 从子线程向主线程发送字符串。
  code_template: |-
    use std::sync::mpsc;
    use std::thread;

    fn main() {
        let (tx, rx) = mpsc::channel();
        thread::spawn(move || {
            tx.send("hi".to_string()).unwrap();
        });
        println!("{}", rx.recv().unwrap());
    }
