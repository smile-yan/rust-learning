- title: 取前 N 个字符
  description: '编写函数 first_n(s: &str, n: usize) -> &str，返回字符串前 n 个字符（按字节）。'
  code_template: |-
    fn first_n(s: &str, n: usize) -> &str {
        &s[..n]
    }

    fn main() {
        println!("{}", first_n("Hello Rust", 5));
    }
