- title: 给函数写文档注释
  description: 为 add 函数编写 /// 文档注释，并在注释中写一个可运行的示例代码块。
  code_template: |-
    /// 计算两数之和
    ///
    /// # Examples
    /// ```
    /// assert_eq!(add(2, 3), 5);
    /// ```
    fn add(a: i32, b: i32) -> i32 {
        a + b
    }

    fn main() {
        println!("{}", add(2, 3));
    }
