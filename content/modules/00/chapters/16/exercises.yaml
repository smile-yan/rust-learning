- title: 使用 break 和 continue
  description: 写一个 loop，当 count 等于 5 时用 break 退出，偶数时用 continue 跳过打印。
  code_template: |-
    fn main() {
        let mut count = 0;
        loop {
            count += 1;
            if count % 2 == 0 { continue; }
            if count > 5 { break; }
            println!("{}", count);
        }
    }
