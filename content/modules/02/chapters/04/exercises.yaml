- title: 定义 Axum 路由
  description: 创建一个 Router，把 GET /hello 映射到返回字符串的 handler。
  code_template: |-
    use axum::{routing::get, Router};

    async fn hello() -> &'static str {
        "Hello, Axum!"
    }

    fn main() {
        let app = Router::new().route("/hello", get(hello));
        println!("路由创建成功");
    }
