- title: 用 serde 序列化结构体
  description: '定义 #[derive(Serialize)] 的 User，并用 serde_json::to_string 输出 JSON。'
  code_template: |-
    use serde::Serialize;

    #[derive(Serialize)]
    struct User {
        name: String,
        age: u32,
    }

    fn main() {
        let u = User { name: String::from("Alice"), age: 30 };
        println!("{}", serde_json::to_string(&u).unwrap());
    }
