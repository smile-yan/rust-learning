- title: 计算余弦相似度
  description: 实现 dot_product 和 cosine_similarity，计算两个简单向量的相似度。
  code_template: |-
    fn dot_product(a: &[f64], b: &[f64]) -> f64 {
        a.iter().zip(b.iter()).map(|(x, y)| x * y).sum()
    }

    fn main() {
        let a = [1.0, 0.0];
        let b = [0.0, 1.0];
        println!("{}", dot_product(&a, &b));
    }
