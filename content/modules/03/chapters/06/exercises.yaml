- title: 包装 unsafe 函数
  description: 写一个 safe 包装函数，内部用 unsafe 调用 strlen。
  code_template: |-
    use std::os::raw::c_char;

    extern "C" {
        fn strlen(s: *const c_char) -> usize;
    }

    fn safe_len(s: &std::ffi::CStr) -> usize {
        unsafe { strlen(s.as_ptr()) }
    }

    fn main() {
        let s = std::ffi::CString::new("hello").unwrap();
        println!("{}", safe_len(&s));
    }
