<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380">
  <defs>
    <style>
      .bg { fill: #fff8f0; }
      .card { fill: #ffffff; stroke: #e0d6cc; stroke-width: 2; }
      .title { font: bold 22px system-ui, -apple-system, sans-serif; fill: #1a1a1a; }
      .text { font: 15px system-ui, -apple-system, sans-serif; fill: #2a2a2a; }
      .code { font: 14px "SF Mono", Menlo, monospace; fill: #3a2a1a; }
      .label { font: 13px system-ui, -apple-system, sans-serif; fill: #5a5a5a; }
      .arrow { stroke: #7a6a5a; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .highlight { fill: #ffeacc; stroke: #ffaa55; stroke-width: 2; }
      .box { fill: #e8f4ff; stroke: #3399ff; stroke-width: 2; }
      .box2 { fill: #f0ffe8; stroke: #66bb33; stroke-width: 2; }
      .box3 { fill: #fff0f5; stroke: #dd5599; stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7a6a5a"/>
    </marker>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5c4b37"/>
    </marker>
  </defs>
  <rect width="640" height="380" class="bg"/>
  <rect x="16" y="16" width="608" height="348" rx="12" class="card"/>
  <text x="320" y="40" text-anchor="middle" class="title">正则表达式 regex：在文本中搜索模式</text>
  <rect x="40" y="55" width="560" height="285" fill="#fff3e0" stroke="#d4a76a" stroke-width="2" rx="8"/>
  <text x="320" y="86" font-size="14" font-weight="bold" fill="#3d3229" text-anchor="middle">输入文本 → Regex 引擎 → 匹配结果</text>
  <rect x="70" y="108" width="180" height="80" fill="#e8f5e9" stroke="#66bb6a" stroke-width="2" rx="8"/>
  <text x="160" y="133" font-size="13" font-weight="bold" fill="#3d3229" text-anchor="middle">原始文本</text>
  <text x="160" y="153" font-size="12" fill="#666" text-anchor="middle">"hello rust123"</text>
  <text x="160" y="169" font-size="12" fill="#666" text-anchor="middle">"abc@example.com"</text>
  <line x1="250" y1="148" x2="300" y2="148" stroke="#5c4b37" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="310" y="108" width="140" height="80" fill="#e3f2fd" stroke="#42a5f5" stroke-width="2" rx="8"/>
  <text x="380" y="133" font-size="13" font-weight="bold" fill="#3d3229" text-anchor="middle">Regex 模式</text>
  <text x="380" y="153" font-size="12" fill="#666" text-anchor="middle">\d+ → 匹配数字</text>
  <text x="380" y="169" font-size="12" fill="#666" text-anchor="middle">\w+@\w+\.\w+</text>
  <line x1="380" y1="188" x2="380" y2="228" stroke="#5c4b37" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="230" y="234" width="300" height="62" fill="#fce4ec" stroke="#ec407a" stroke-width="2" rx="8"/>
  <text x="380" y="260" font-size="13" font-weight="bold" fill="#3d3229" text-anchor="middle">Match / Captures / Replace</text>
  <text x="380" y="278" font-size="12" fill="#666" text-anchor="middle">find · split · replace_all</text>
  <text x="320" y="320" font-size="13" fill="#5c4b37" text-anchor="middle">编译一次，多次复用；零拷贝切片引用匹配结果</text>
</svg>
