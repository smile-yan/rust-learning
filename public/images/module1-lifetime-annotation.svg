<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="424" viewBox="0 0 640 424">
  <defs>
    <style>
      .bg { fill: #fff8f0; }
      .card { fill: #ffffff; stroke: #e0d6cc; stroke-width: 2; }
      .title { font: bold 22px system-ui, -apple-system, sans-serif; fill: #1a1a1a; }
      .text { font: 15px system-ui, -apple-system, sans-serif; fill: #2a2a2a; }
      .code { font: 14px "SF Mono", Menlo, monospace; fill: #3a2a1a; }
      .label { font: 13px system-ui, -apple-system, sans-serif; fill: #5a5a5a; }
      .arrow { stroke: #7a6a5a; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .highlight { fill: #ffeacc; stroke: #ffaa55; stroke-width: 2; }
      .box { fill: #e8f4ff; stroke: #3399ff; stroke-width: 2; }
      .box2 { fill: #f0ffe8; stroke: #66bb33; stroke-width: 2; }
      .box3 { fill: #fff0f5; stroke: #dd5599; stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7a6a5a"/>
    </marker>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5c4b37"/>
    </marker>
  </defs>
  <rect width="640" height="424" class="bg"/>
  <rect x="16" y="16" width="608" height="392" rx="12" class="card"/>
  <text x="320" y="62" text-anchor="middle" class="title">生命周期标注：显式声明引用关系</text>
  <rect x="60" y="82" width="520" height="70" fill="#fff3e0" stroke="#fb8c00" stroke-width="2" rx="8"/><text x="320" y="117" font-size="15" font-weight="bold" fill="#3d3229" text-anchor="middle">fn longest&lt;&#x27;a&gt;(x: &amp;&#x27;a str, y: &amp;&#x27;a str) -&gt; &amp;&#x27;a str</text><text x="320" y="142" font-size="12" font-weight="normal" fill="#666" text-anchor="middle">返回值生命周期 = 输入参数中较短的生命周期</text><rect x="80" y="192" width="200" height="90" fill="#e8f5e9" stroke="#66bb6a" stroke-width="2" rx="8"/><text x="180" y="222" font-size="14" font-weight="bold" fill="#3d3229" text-anchor="middle">x: &amp;&#x27;a str</text><text x="180" y="247" font-size="12" font-weight="normal" fill="#3d3229" text-anchor="middle">字符串1</text><rect x="360" y="192" width="200" height="90" fill="#e3f2fd" stroke="#42a5f5" stroke-width="2" rx="8"/><text x="460" y="222" font-size="14" font-weight="bold" fill="#3d3229" text-anchor="middle">y: &amp;&#x27;a str</text><text x="460" y="247" font-size="12" font-weight="normal" fill="#3d3229" text-anchor="middle">字符串2</text><line x1="180" y1="282" x2="290" y2="312" stroke="#5c4b37" stroke-width="2" marker-end="url(#arrow)"/><line x1="460" y1="282" x2="350" y2="312" stroke="#5c4b37" stroke-width="2" marker-end="url(#arrow)"/><rect x="245" y="312" width="150" height="50" fill="#ffe0b2" stroke="#fb8c00" stroke-width="2" rx="8"/><text x="320" y="342" font-size="14" font-weight="bold" fill="#3d3229" text-anchor="middle">&amp;&#x27;a str</text>
</svg>
