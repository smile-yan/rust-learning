<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 359" width="600" height="359">
  <defs>
    <style>
      .bg { fill: #fff8f0; }
      .card { fill: #ffffff; stroke: #e0d6cc; stroke-width: 2; }
      .title { font: bold 22px system-ui, -apple-system, sans-serif; fill: #1a1a1a; }
      .text { font: 15px system-ui, -apple-system, sans-serif; fill: #2a2a2a; }
      .code { font: 14px "SF Mono", Menlo, monospace; fill: #3a2a1a; }
      .label { font: 13px system-ui, -apple-system, sans-serif; fill: #5a5a5a; }
      .arrow { stroke: #7a6a5a; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .highlight { fill: #ffeacc; stroke: #ffaa55; stroke-width: 2; }
      .box { fill: #e8f4ff; stroke: #3399ff; stroke-width: 2; }
      .box2 { fill: #f0ffe8; stroke: #66bb33; stroke-width: 2; }
      .box3 { fill: #fff0f5; stroke: #dd5599; stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7a6a5a"/>
    </marker>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="600" height="359" class="bg"/>
  <rect x="16" y="16" width="568" height="327" rx="12" class="card"/>
  <text x="300" y="62" text-anchor="middle" class="title">⏳ Future 状态机</text>
  <circle cx="90" cy="170" r="50" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="90" y="187" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1b5e20">Start</text>
  <text x="90" y="207" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#333">创建 Future</text>
  <rect x="190" y="142" width="160" height="100" fill="#fff3e0" stroke="#ef6c00" stroke-width="2" rx="8"/>
  <text x="270" y="177" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#e65100">Poll::Pending</text>
  <text x="270" y="202" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#333">等待 I/O / 定时器</text>
  <text x="270" y="222" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#333">让出线程</text>
  <rect x="400" y="142" width="160" height="100" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" rx="8"/>
  <text x="480" y="177" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0d47a1">Poll::Ready(T)</text>
  <text x="480" y="202" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#333">计算完成</text>
  <text x="480" y="222" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#333">返回结果</text>
  <path d="M 140 170 L 190 170" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 350 170 L 400 170" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 250 242 C 250 275, 310 275, 310 242" stroke="#ef6c00" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="150" y="182" font-family="system-ui, sans-serif" font-size="11" fill="#666">poll</text>
  <text x="356" y="182" font-family="system-ui, sans-serif" font-size="11" fill="#666">wakeup</text>
  <text x="200" y="297" font-family="system-ui, sans-serif" font-size="11" fill="#666">async/await 自动展开</text>
</svg>
