<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="382" viewBox="0 0 640 382">
  <defs>
    <style>
      .bg { fill: #fff8f0; }
      .card { fill: #ffffff; stroke: #e0d6cc; stroke-width: 2; }
      .title { font: bold 22px system-ui, -apple-system, sans-serif; fill: #1a1a1a; }
      .text { font: 15px system-ui, -apple-system, sans-serif; fill: #2a2a2a; }
      .code { font: 14px "SF Mono", Menlo, monospace; fill: #3a2a1a; }
      .label { font: 13px system-ui, -apple-system, sans-serif; fill: #5a5a5a; }
      .arrow { stroke: #7a6a5a; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .highlight { fill: #ffeacc; stroke: #ffaa55; stroke-width: 2; }
      .box { fill: #e8f4ff; stroke: #3399ff; stroke-width: 2; }
      .box2 { fill: #f0ffe8; stroke: #66bb33; stroke-width: 2; }
      .box3 { fill: #fff0f5; stroke: #dd5599; stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7a6a5a"/>
    </marker>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5c4b37"/>
    </marker>
  </defs>
  <rect width="640" height="382" class="bg"/>
  <rect x="16" y="16" width="608" height="350" rx="12" class="card"/>
  <text x="320" y="62" text-anchor="middle" class="title">共享状态：Arc + Mutex</text>
  <rect x="240" y="102" width="160" height="90" fill="#fff3e0" stroke="#fb8c00" stroke-width="2" rx="8"/><text x="320" y="137" font-size="14" font-weight="bold" fill="#3d3229" text-anchor="middle">Arc&lt;Mutex&lt;i32&gt;&gt;</text><text x="320" y="167" font-size="12" font-weight="normal" fill="#3d3229" text-anchor="middle">共享 + 互斥</text><rect x="80" y="262" width="120" height="60" fill="#e8f5e9" stroke="#66bb6a" stroke-width="2" rx="8"/><text x="140" y="297" font-size="14" font-weight="bold" fill="#3d3229" text-anchor="middle">线程 A</text><line x1="140" y1="262" x2="320" y2="192" stroke="#5c4b37" stroke-width="2" marker-end="url(#arrow)"/><rect x="260" y="262" width="120" height="60" fill="#e3f2fd" stroke="#42a5f5" stroke-width="2" rx="8"/><text x="320" y="297" font-size="14" font-weight="bold" fill="#3d3229" text-anchor="middle">线程 B</text><line x1="320" y1="262" x2="320" y2="192" stroke="#5c4b37" stroke-width="2" marker-end="url(#arrow)"/><rect x="440" y="262" width="120" height="60" fill="#f3e5f5" stroke="#ab47bc" stroke-width="2" rx="8"/><text x="500" y="297" font-size="14" font-weight="bold" fill="#3d3229" text-anchor="middle">线程 C</text><line x1="500" y1="262" x2="320" y2="192" stroke="#5c4b37" stroke-width="2" marker-end="url(#arrow)"/><text x="320" y="82" font-size="14" font-weight="normal" fill="#5c4b37" text-anchor="middle">Arc 提供线程安全引用计数，Mutex 提供排他访问</text><text x="320" y="352" font-size="12" font-weight="normal" fill="#666" text-anchor="middle">必须加锁才能修改，MutexGuard 自动释放锁</text>
</svg>
