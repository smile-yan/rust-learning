<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380">
  <defs>
    <style>
      .bg { fill: #fff8f0; }
      .card { fill: #ffffff; stroke: #e0d6cc; stroke-width: 2; }
      .title { font: bold 22px system-ui, -apple-system, sans-serif; fill: #1a1a1a; }
      .text { font: 15px system-ui, -apple-system, sans-serif; fill: #2a2a2a; }
      .code { font: 14px "SF Mono", Menlo, monospace; fill: #3a2a1a; }
      .label { font: 13px system-ui, -apple-system, sans-serif; fill: #5a5a5a; }
      .box { fill: #e8f4ff; stroke: #3399ff; stroke-width: 2; }
      .box2 { fill: #f0ffe8; stroke: #66bb33; stroke-width: 2; }
      .box3 { fill: #fff0f5; stroke: #dd5599; stroke-width: 2; }
    </style>
  </defs>
  <rect width="720" height="380" class="bg"/>
  <rect x="16" y="16" width="688" height="348" rx="12" class="card"/>
  <text x="360" y="62" text-anchor="middle" class="title">定时器与时间处理 std::time / tokio::time</text>

  <rect x="60" y="95" width="190" height="120" rx="8" class="box"/>
  <text x="80" y="130" class="text">Instant</text>
  <text x="80" y="160" class="label">单调时钟，测耗时</text>
  <text x="80" y="190" class="code">start.elapsed()</text>

  <rect x="265" y="95" width="190" height="120" rx="8" class="box2"/>
  <text x="285" y="130" class="text">SystemTime</text>
  <text x="285" y="160" class="label">系统时间 / 时间戳</text>
  <text x="285" y="190" class="code">UNIX_EPOCH</text>

  <rect x="470" y="95" width="190" height="120" rx="8" class="box3"/>
  <text x="490" y="130" class="text">Duration</text>
  <text x="490" y="160" class="label">时间段</text>
  <text x="490" y="190" class="code">from_secs(1)</text>

  <text x="360" y="265" text-anchor="middle" class="text">⏱ 阻塞等待用 thread::sleep，异步场景用 tokio::time</text>
  <text x="360" y="305" text-anchor="middle" class="code">tokio::time::sleep(Duration::from_secs(1)).await;</text>

  <text x="360" y="345" text-anchor="middle" class="label">async 定时与超时控制交给 tokio::time（sleep / timeout / interval）</text>

</svg>
