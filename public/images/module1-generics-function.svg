<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="406" viewBox="0 0 640 406">
  <defs>
    <style>
      .bg { fill: #fff8f0; }
      .card { fill: #ffffff; stroke: #e0d6cc; stroke-width: 2; }
      .title { font: bold 22px system-ui, -apple-system, sans-serif; fill: #1a1a1a; }
      .text { font: 15px system-ui, -apple-system, sans-serif; fill: #2a2a2a; }
      .code { font: 14px "SF Mono", Menlo, monospace; fill: #3a2a1a; }
      .label { font: 13px system-ui, -apple-system, sans-serif; fill: #5a5a5a; }
      .arrow { stroke: #7a6a5a; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .highlight { fill: #ffeacc; stroke: #ffaa55; stroke-width: 2; }
      .box { fill: #e8f4ff; stroke: #3399ff; stroke-width: 2; }
      .box2 { fill: #f0ffe8; stroke: #66bb33; stroke-width: 2; }
      .box3 { fill: #fff0f5; stroke: #dd5599; stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7a6a5a"/>
    </marker>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5c4b37"/>
    </marker>
  </defs>
  <rect width="640" height="406" class="bg"/>
  <rect x="16" y="16" width="608" height="374" rx="12" class="card"/>
  <text x="320" y="62" text-anchor="middle" class="title">泛型函数：一次编写，多处复用</text>
  <rect x="60" y="102" width="520" height="244" fill="#fff3e0" stroke="#d4a76a" stroke-width="2" rx="8"/><text x="320" y="137" font-size="16" font-weight="bold" fill="#3d3229" text-anchor="middle">fn largest&lt;T: PartialOrd&gt;(list: &amp;[T]) -&gt; &amp;T</text><rect x="90" y="177" width="130" height="70" fill="#e8f5e9" stroke="#66bb6a" stroke-width="2" rx="8"/><text x="155" y="202" font-size="14" font-weight="normal" fill="#3d3229" text-anchor="middle">[i32]</text><text x="155" y="227" font-size="12" font-weight="normal" fill="#666" text-anchor="middle">i32 切片</text><line x1="220" y1="212" x2="270" y2="212" stroke="#5c4b37" stroke-width="2" marker-end="url(#arrow)"/><rect x="420" y="177" width="130" height="70" fill="#e3f2fd" stroke="#42a5f5" stroke-width="2" rx="8"/><text x="485" y="202" font-size="14" font-weight="normal" fill="#3d3229" text-anchor="middle">[char]</text><text x="485" y="227" font-size="12" font-weight="normal" fill="#666" text-anchor="middle">字符切片</text><line x1="420" y1="212" x2="370" y2="212" stroke="#5c4b37" stroke-width="2" marker-end="url(#arrow)"/><rect x="270" y="172" width="100" height="80" fill="#ffe0b2" stroke="#fb8c00" stroke-width="2" rx="8"/><text x="320" y="212" font-size="14" font-weight="bold" fill="#3d3229" text-anchor="middle">largest</text><text x="320" y="237" font-size="12" font-weight="normal" fill="#3d3229" text-anchor="middle">&lt;T&gt;</text><line x1="320" y1="252" x2="320" y2="292" stroke="#5c4b37" stroke-width="2" marker-end="url(#arrow)"/><text x="320" y="328" font-size="14" font-weight="normal" fill="#5c4b37" text-anchor="middle">返回 &amp;T（引用）</text><text x="320" y="82" font-size="15" font-weight="normal" fill="#5c4b37" text-anchor="middle">一个泛型函数同时处理多种类型</text>
</svg>
