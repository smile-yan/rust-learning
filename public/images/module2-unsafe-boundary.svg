<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="520" height="320">
  <defs>
    <style>
      .bg { fill: #fff8f0; }
      .card { fill: #ffffff; stroke: #e0d6cc; stroke-width: 2; }
      .title { font: bold 22px system-ui, -apple-system, sans-serif; fill: #1a1a1a; }
      .text { font: 15px system-ui, -apple-system, sans-serif; fill: #2a2a2a; }
      .code { font: 14px "SF Mono", Menlo, monospace; fill: #3a2a1a; }
      .label { font: 13px system-ui, -apple-system, sans-serif; fill: #5a5a5a; }
      .arrow { stroke: #7a6a5a; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .highlight { fill: #ffeacc; stroke: #ffaa55; stroke-width: 2; }
      .box { fill: #e8f4ff; stroke: #3399ff; stroke-width: 2; }
      .box2 { fill: #f0ffe8; stroke: #66bb33; stroke-width: 2; }
      .box3 { fill: #fff0f5; stroke: #dd5599; stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7a6a5a"/>
    </marker>
  </defs>
  <rect width="520" height="320" class="bg"/>
  <rect x="16" y="16" width="488" height="288" rx="12" class="card"/>
  <text x="260" y="40" text-anchor="middle" class="title">🛡️ safe API 包裹 unsafe 核心</text>
  <rect x="60" y="60" width="400" height="200" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="8"/>
  <text x="260" y="90" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b5e20">safe Rust 公开接口</text>
  <text x="260" y="115" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#333">封装不变量、检查前置条件</text>
  <rect x="140" y="140" width="240" height="90" fill="#ffebee" stroke="#c62828" stroke-width="2" rx="8" stroke-dasharray="6,4"/>
  <text x="260" y="170" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#b71c1c">unsafe { ... }</text>
  <text x="260" y="195" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#333">裸指针 / FFI / union</text>
  <text x="260" y="215" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#333">程序员负责安全保证</text>
  <path d="M 260 130 L 260 140" stroke="#c62828" stroke-width="2"/>
</svg>
