<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320">
  <defs>
    <style>
      .bg { fill: #fff8f0; }
      .card { fill: #ffffff; stroke: #e0d6cc; stroke-width: 2; }
      .title { font: bold 22px system-ui, -apple-system, sans-serif; fill: #1a1a1a; }
      .text { font: 15px system-ui, -apple-system, sans-serif; fill: #2a2a2a; }
      .code { font: 14px "SF Mono", Menlo, monospace; fill: #3a2a1a; }
      .label { font: 13px system-ui, -apple-system, sans-serif; fill: #5a5a5a; }
      .arrow { stroke: #7a6a5a; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .highlight { fill: #ffeacc; stroke: #ffaa55; stroke-width: 2; }
      .box { fill: #e8f4ff; stroke: #3399ff; stroke-width: 2; }
      .box2 { fill: #f0ffe8; stroke: #66bb33; stroke-width: 2; }
      .box3 { fill: #fff0f5; stroke: #dd5599; stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7a6a5a"/>
    </marker>
  </defs>
  <rect width="720" height="320" class="bg"/>
  <rect x="16" y="16" width="688" height="288" rx="12" class="card"/>
  <text x="360" y="62" text-anchor="middle" class="title">🔒 RAII 资源生命周期</text>

  <!-- 创建 -->
  <rect x="60" y="100" width="160" height="120" rx="10" class="box"/>
  <text x="140" y="145" text-anchor="middle" class="text">创建</text>
  <text x="140" y="185" text-anchor="middle" class="code">new()</text>

  <!-- 箭头1 -->
  <line x1="230" y1="160" x2="270" y2="160" class="arrow"/>

  <!-- 使用 -->
  <rect x="280" y="100" width="160" height="120" rx="10" class="box2"/>
  <text x="360" y="145" text-anchor="middle" class="text">使用资源</text>
  <text x="360" y="185" text-anchor="middle" class="label">读取 / 写入 / 计算</text>

  <!-- 箭头2 -->
  <line x1="450" y1="160" x2="490" y2="160" class="arrow"/>

  <!-- 释放 -->
  <rect x="500" y="100" width="160" height="120" rx="10" class="box3"/>
  <text x="580" y="145" text-anchor="middle" class="text">释放</text>
  <text x="580" y="185" text-anchor="middle" class="code">drop()</text>

  <text x="360" y="270" text-anchor="middle" class="label">资源获取即初始化，离开作用域自动释放，无需手动 free / close / unlock</text>
</svg>
