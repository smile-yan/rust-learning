<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410">
  <defs>
    <style>
      .bg { fill: #fff8f0; }
      .card { fill: #ffffff; stroke: #e0d6cc; stroke-width: 2; }
      .title { font: bold 22px system-ui, -apple-system, sans-serif; fill: #1a1a1a; }
      .text { font: 15px system-ui, -apple-system, sans-serif; fill: #2a2a2a; }
      .code { font: 14px "SF Mono", Menlo, monospace; fill: #3a2a1a; }
      .label { font: 13px system-ui, -apple-system, sans-serif; fill: #5a5a5a; }
      .arrow { stroke: #7a6a5a; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .highlight { fill: #ffeacc; stroke: #ffaa55; stroke-width: 2; }
      .box { fill: #e8f4ff; stroke: #3399ff; stroke-width: 2; }
      .box2 { fill: #f0ffe8; stroke: #66bb33; stroke-width: 2; }
      .box3 { fill: #fff0f5; stroke: #dd5599; stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7a6a5a"/>
    </marker>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5c4b37"/>
    </marker>
  </defs>
  <rect width="640" height="410" class="bg"/>
  <rect x="16" y="16" width="608" height="378" rx="12" class="card"/>
  <text x="320" y="62" text-anchor="middle" class="title">Rc&lt;T&gt;：多所有者共享</text>
  <rect x="260" y="182" width="120" height="80" fill="#fff3e0" stroke="#fb8c00" stroke-width="2" rx="8"/><text x="320" y="212" font-size="14" font-weight="bold" fill="#3d3229" text-anchor="middle">数据</text><text x="320" y="237" font-size="12" font-weight="normal" fill="#3d3229" text-anchor="middle">Vec&lt;i32&gt;</text><rect x="80" y="102" width="120" height="60" fill="#e8f5e9" stroke="#66bb6a" stroke-width="2" rx="8"/><text x="140" y="137" font-size="14" font-weight="bold" fill="#3d3229" text-anchor="middle">owner A</text><rect x="80" y="282" width="120" height="60" fill="#e3f2fd" stroke="#42a5f5" stroke-width="2" rx="8"/><text x="140" y="317" font-size="14" font-weight="bold" fill="#3d3229" text-anchor="middle">owner B</text><rect x="440" y="102" width="120" height="60" fill="#f3e5f5" stroke="#ab47bc" stroke-width="2" rx="8"/><text x="500" y="137" font-size="14" font-weight="bold" fill="#3d3229" text-anchor="middle">owner C</text><line x1="200" y1="132" x2="260" y2="192" stroke="#5c4b37" stroke-width="2" marker-end="url(#arrow)"/><line x1="200" y1="312" x2="260" y2="252" stroke="#5c4b37" stroke-width="2" marker-end="url(#arrow)"/><line x1="440" y1="132" x2="380" y2="192" stroke="#5c4b37" stroke-width="2" marker-end="url(#arrow)"/><text x="320" y="82" font-size="14" font-weight="bold" fill="#5c4b37" text-anchor="middle">引用计数 strong_count = 3</text><text x="320" y="380" font-size="12" font-weight="normal" fill="#666" text-anchor="middle">Rc&lt;T&gt; 只读共享；需要内部可变性时搭配 RefCell</text>
</svg>
