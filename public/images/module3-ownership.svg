<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360">
  <defs>
    <style>
      .bg { fill: #fff8f0; }
      .card { fill: #ffffff; stroke: #e0d6cc; stroke-width: 2; }
      .title { font: bold 22px system-ui, -apple-system, sans-serif; fill: #1a1a1a; }
      .text { font: 15px system-ui, -apple-system, sans-serif; fill: #2a2a2a; }
      .code { font: 14px "SF Mono", Menlo, monospace; fill: #3a2a1a; }
      .label { font: 13px system-ui, -apple-system, sans-serif; fill: #5a5a5a; }
      .arrow { stroke: #7a6a5a; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .highlight { fill: #ffeacc; stroke: #ffaa55; stroke-width: 2; }
      .box { fill: #e8f4ff; stroke: #3399ff; stroke-width: 2; }
      .box2 { fill: #f0ffe8; stroke: #66bb33; stroke-width: 2; }
      .box3 { fill: #fff0f5; stroke: #dd5599; stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7a6a5a"/>
    </marker>
  </defs>
  <rect width="720" height="360" class="bg"/>
  <rect x="16" y="16" width="688" height="328" rx="12" class="card"/>
  <text x="360" y="62" text-anchor="middle" class="title">🦀 所有权移动示意</text>

  <!-- 移动前 -->
  <rect x="50" y="100" width="280" height="180" rx="10" class="box"/>
  <text x="190" y="130" text-anchor="middle" class="text">移动前</text>
  <text x="70" y="168" class="code">let s1 = String::from("hello");</text>
  <text x="70" y="200" class="label">栈: s1 (ptr / len / cap)</text>
  <text x="70" y="232" class="label">堆: "hello"</text>
  <text x="70" y="264" class="label">s1 指向堆内存</text>

  <!-- 箭头 -->
  <line x1="340" y1="190" x2="380" y2="190" class="arrow"/>

  <!-- 移动后 -->
  <rect x="390" y="100" width="280" height="180" rx="10" class="box2"/>
  <text x="530" y="130" text-anchor="middle" class="text">移动后</text>
  <text x="410" y="168" class="code">let s2 = s1;</text>
  <text x="410" y="200" class="label">栈: s2 (ptr / len / cap)</text>
  <text x="410" y="232" class="label">堆: "hello"</text>
  <text x="410" y="264" class="label">s1 不再有效</text>

  <text x="360" y="320" text-anchor="middle" class="label">所有权从 s1 转移到 s2，堆数据不变，避免二次释放</text>
</svg>
