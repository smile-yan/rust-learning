<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 424" width="560" height="424">
  <defs>
    <style>
      .bg { fill: #fff8f0; }
      .card { fill: #ffffff; stroke: #e0d6cc; stroke-width: 2; }
      .title { font: bold 22px system-ui, -apple-system, sans-serif; fill: #1a1a1a; }
      .text { font: 15px system-ui, -apple-system, sans-serif; fill: #2a2a2a; }
      .code { font: 14px "SF Mono", Menlo, monospace; fill: #3a2a1a; }
      .label { font: 13px system-ui, -apple-system, sans-serif; fill: #5a5a5a; }
      .arrow { stroke: #7a6a5a; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .highlight { fill: #ffeacc; stroke: #ffaa55; stroke-width: 2; }
      .box { fill: #e8f4ff; stroke: #3399ff; stroke-width: 2; }
      .box2 { fill: #f0ffe8; stroke: #66bb33; stroke-width: 2; }
      .box3 { fill: #fff0f5; stroke: #dd5599; stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7a6a5a"/>
    </marker>
  </defs>
  <rect width="560" height="424" class="bg"/>
  <rect x="16" y="16" width="528" height="392" rx="12" class="card"/>
  <text x="280" y="62" text-anchor="middle" class="title">⚙️ Tokio 运行时架构</text>
  <rect x="40" y="82" width="480" height="80" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" rx="8"/>
  <text x="280" y="117" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0d47a1">应用层 async fn / .await</text>
  <text x="280" y="142" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#333">业务代码：spawn、join、select、channel</text>
  <rect x="40" y="182" width="480" height="80" fill="#fff3e0" stroke="#ef6c00" stroke-width="2" rx="8"/>
  <text x="280" y="217" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#e65100">调度层 线程池 + 工作窃取</text>
  <text x="280" y="242" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#333">将任务分配到多个 worker 线程执行</text>
  <rect x="40" y="282" width="480" height="80" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="8"/>
  <text x="280" y="317" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b5e20">I/O 驱动 epoll/kqueue/IOCP</text>
  <text x="280" y="342" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#333">监听网络、定时器、文件事件并唤醒任务</text>
  <path d="M 280 140 L 280 160" stroke="#666" stroke-width="2"/>
  <path d="M 280 240 L 280 260" stroke="#666" stroke-width="2"/>
</svg>
