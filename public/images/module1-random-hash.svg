<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="455" viewBox="0 0 640 455">
  <defs>
    <style>
      .bg { fill: #fff8f0; }
      .card { fill: #ffffff; stroke: #e0d6cc; stroke-width: 2; }
      .title { font: bold 22px system-ui, -apple-system, sans-serif; fill: #1a1a1a; }
      .text { font: 15px system-ui, -apple-system, sans-serif; fill: #2a2a2a; }
      .code { font: 14px "SF Mono", Menlo, monospace; fill: #3a2a1a; }
      .label { font: 13px system-ui, -apple-system, sans-serif; fill: #5a5a5a; }
      .arrow { stroke: #7a6a5a; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .highlight { fill: #ffeacc; stroke: #ffaa55; stroke-width: 2; }
      .box { fill: #e8f4ff; stroke: #3399ff; stroke-width: 2; }
      .box2 { fill: #f0ffe8; stroke: #66bb33; stroke-width: 2; }
      .box3 { fill: #fff0f5; stroke: #dd5599; stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7a6a5a"/>
    </marker>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5c4b37"/>
    </marker>
  </defs>
  <rect width="640" height="455" class="bg"/>
  <rect x="16" y="16" width="608" height="423" rx="12" class="card"/>
  <text x="320" y="62" text-anchor="middle" class="title">随机数与哈希 rand / 哈希函数</text>
  <rect x="40" y="78" width="560" height="315" fill="#fff3e0" stroke="#d4a76a" stroke-width="2" rx="8"/>
  <text x="320" y="108" font-size="14" font-weight="bold" fill="#3d3229" text-anchor="middle">随机数生成与哈希</text>
  <rect x="80" y="130" width="160" height="88" fill="#e8f5e9" stroke="#66bb6a" stroke-width="2" rx="8"/>
  <text x="160" y="150" font-size="13" font-weight="bold" fill="#3d3229" text-anchor="middle">rand crate</text>
  <text x="160" y="170" font-size="12" fill="#666" text-anchor="middle">thread_rng()</text>
  <text x="160" y="190" font-size="12" fill="#666" text-anchor="middle">uniform / range</text>
  <text x="160" y="208" font-size="12" fill="#666" text-anchor="middle">gen / gen_bool</text>
  <line x1="240" y1="174" x2="280" y2="174" stroke="#5c4b37" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="290" y="130" width="160" height="88" fill="#e3f2fd" stroke="#42a5f5" stroke-width="2" rx="8"/>
  <text x="370" y="150" font-size="13" font-weight="bold" fill="#3d3229" text-anchor="middle">可重复序列</text>
  <text x="370" y="170" font-size="12" fill="#666" text-anchor="middle">StdRng / SeedableRng</text>
  <text x="370" y="190" font-size="12" fill="#666" text-anchor="middle">固定种子</text>
  <text x="370" y="208" font-size="12" fill="#666" text-anchor="middle">测试可复现</text>
  <line x1="370" y1="218" x2="370" y2="258" stroke="#5c4b37" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="220" y="262" width="300" height="65" fill="#fce4ec" stroke="#ec407a" stroke-width="2" rx="8"/>
  <text x="370" y="286" font-size="13" font-weight="bold" fill="#3d3229" text-anchor="middle">哈希函数 std::hash / sha2 / blake3</text>
  <text x="370" y="304" font-size="12" fill="#666" text-anchor="middle">SipHash / blake3 / sha2 分别适用不同场景</text>
  <text x="320" y="369" font-size="13" fill="#5c4b37" text-anchor="middle">rand 提供安全随机数，std::hash 提供通用哈希 trait</text>
</svg>
