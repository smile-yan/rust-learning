<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="406" viewBox="0 0 640 406">
  <defs>
    <style>
      .bg { fill: #fff8f0; }
      .card { fill: #ffffff; stroke: #e0d6cc; stroke-width: 2; }
      .title { font: bold 22px system-ui, -apple-system, sans-serif; fill: #1a1a1a; }
      .text { font: 15px system-ui, -apple-system, sans-serif; fill: #2a2a2a; }
      .code { font: 14px "SF Mono", Menlo, monospace; fill: #3a2a1a; }
      .label { font: 13px system-ui, -apple-system, sans-serif; fill: #5a5a5a; }
      .arrow { stroke: #7a6a5a; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .highlight { fill: #ffeacc; stroke: #ffaa55; stroke-width: 2; }
      .box { fill: #e8f4ff; stroke: #3399ff; stroke-width: 2; }
      .box2 { fill: #f0ffe8; stroke: #66bb33; stroke-width: 2; }
      .box3 { fill: #fff0f5; stroke: #dd5599; stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7a6a5a"/>
    </marker>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5c4b37"/>
    </marker>
  </defs>
  <rect width="640" height="406" class="bg"/>
  <rect x="16" y="16" width="608" height="374" rx="12" class="card"/>
  <text x="320" y="62" text-anchor="middle" class="title">网络编程基础：TcpListener / TcpStream</text>
  <rect x="40" y="77" width="560" height="290" fill="#fff3e0" stroke="#d4a76a" stroke-width="2" rx="8"/>
  <text x="320" y="107" font-size="14" font-weight="bold" fill="#3d3229" text-anchor="middle">TCP 客户端-服务端通信</text>
  <rect x="80" y="132" width="160" height="88" fill="#e8f5e9" stroke="#66bb6a" stroke-width="2" rx="8"/>
  <text x="160" y="153" font-size="13" font-weight="bold" fill="#3d3229" text-anchor="middle">Server</text>
  <text x="160" y="173" font-size="12" fill="#666" text-anchor="middle">TcpListener::bind</text>
  <text x="160" y="191" font-size="12" fill="#666" text-anchor="middle">.accept() → TcpStream</text>
  <text x="160" y="209" font-size="12" fill="#666" text-anchor="middle">read / write</text>
  <line x1="240" y1="176" x2="400" y2="176" stroke="#5c4b37" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="160" font-size="12" fill="#5c4b37" text-anchor="middle">TCP 连接</text>
  <text x="320" y="196" font-size="12" fill="#5c4b37" text-anchor="middle">127.0.0.1:8080</text>
  <rect x="400" y="132" width="160" height="88" fill="#e3f2fd" stroke="#42a5f5" stroke-width="2" rx="8"/>
  <text x="480" y="153" font-size="13" font-weight="bold" fill="#3d3229" text-anchor="middle">Client</text>
  <text x="480" y="173" font-size="12" fill="#666" text-anchor="middle">TcpStream::connect</text>
  <text x="480" y="191" font-size="12" fill="#666" text-anchor="middle">.write()</text>
  <text x="480" y="209" font-size="12" fill="#666" text-anchor="middle">.read()</text>
  <line x1="320" y1="220" x2="320" y2="254" stroke="#5c4b37" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="190" y="258" width="260" height="50" fill="#fce4ec" stroke="#ec407a" stroke-width="2" rx="8"/>
  <text x="320" y="281" font-size="13" font-weight="bold" fill="#3d3229" text-anchor="middle">std::net：无依赖、零成本抽象</text>
  <text x="320" y="301" font-size="12" fill="#666" text-anchor="middle">SocketAddr · BufReader / BufWriter</text>
  <text x="320" y="348" font-size="13" fill="#5c4b37" text-anchor="middle">std::net 是异步网络框架（tokio/axum）的基础</text>
</svg>
