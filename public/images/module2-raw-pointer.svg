<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="560" height="340">
  <defs>
    <style>
      .bg { fill: #fff8f0; }
      .card { fill: #ffffff; stroke: #e0d6cc; stroke-width: 2; }
      .title { font: bold 22px system-ui, -apple-system, sans-serif; fill: #1a1a1a; }
      .text { font: 15px system-ui, -apple-system, sans-serif; fill: #2a2a2a; }
      .code { font: 14px "SF Mono", Menlo, monospace; fill: #3a2a1a; }
      .label { font: 13px system-ui, -apple-system, sans-serif; fill: #5a5a5a; }
      .arrow { stroke: #7a6a5a; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .highlight { fill: #ffeacc; stroke: #ffaa55; stroke-width: 2; }
      .box { fill: #e8f4ff; stroke: #3399ff; stroke-width: 2; }
      .box2 { fill: #f0ffe8; stroke: #66bb33; stroke-width: 2; }
      .box3 { fill: #fff0f5; stroke: #dd5599; stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7a6a5a"/>
    </marker>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="560" height="340" class="bg"/>
  <rect x="16" y="16" width="528" height="308" rx="12" class="card"/>
  <text x="280" y="40" text-anchor="middle" class="title">🦀 引用 vs 裸指针</text>
  <rect x="40" y="80" width="200" height="200" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" rx="8"/>
  <text x="140" y="110" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0d47a1">&amp;T / &amp;mut T</text>
  <text x="140" y="140" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#333">✅ 借用检查</text>
  <text x="140" y="165" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#333">✅ 生命周期保证</text>
  <text x="140" y="190" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#333">✅ 不可为空</text>
  <text x="140" y="225" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#333">编译器担保有效</text>
  <rect x="320" y="80" width="200" height="200" fill="#fff3e0" stroke="#ef6c00" stroke-width="2" rx="8"/>
  <text x="420" y="110" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#e65100">*const T / *mut T</text>
  <text x="420" y="140" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#333">⚠️ 无借用检查</text>
  <text x="420" y="165" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#333">⚠️ 可为 null</text>
  <text x="420" y="190" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#333">⚠️ 可指向无效内存</text>
  <text x="420" y="225" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#333">需要 unsafe 块解引用</text>
  <line x1="240" y1="190" x2="312" y2="190" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="276" y="180" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#666">安全责任转移</text>
</svg>
