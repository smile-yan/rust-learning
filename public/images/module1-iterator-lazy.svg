<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="508" viewBox="0 0 640 508">
  <defs>
    <style>
      .bg { fill: #fff8f0; }
      .card { fill: #ffffff; stroke: #e0d6cc; stroke-width: 2; }
      .title { font: bold 22px system-ui, -apple-system, sans-serif; fill: #1a1a1a; }
      .text { font: 15px system-ui, -apple-system, sans-serif; fill: #2a2a2a; }
      .code { font: 14px "SF Mono", Menlo, monospace; fill: #3a2a1a; }
      .label { font: 13px system-ui, -apple-system, sans-serif; fill: #5a5a5a; }
      .arrow { stroke: #7a6a5a; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .highlight { fill: #ffeacc; stroke: #ffaa55; stroke-width: 2; }
      .box { fill: #e8f4ff; stroke: #3399ff; stroke-width: 2; }
      .box2 { fill: #f0ffe8; stroke: #66bb33; stroke-width: 2; }
      .box3 { fill: #fff0f5; stroke: #dd5599; stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7a6a5a"/>
    </marker>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5c4b37"/>
    </marker>
  </defs>
  <rect width="640" height="508" class="bg"/>
  <rect x="16" y="16" width="608" height="476" rx="12" class="card"/>
  <text x="320" y="62" text-anchor="middle" class="title">迭代器：惰性求值链</text>
  <rect x="40" y="78" width="560" height="368" fill="#fff3e0" stroke="#d4a76a" stroke-width="2" rx="8"/>
  <text x="320" y="108" font-size="14" font-weight="bold" fill="#3d3229" text-anchor="middle">惰性链：适配器串联，消费时才执行</text>
  <!-- 第一行：vec! → iter() → map() -->
  <rect x="70" y="142" width="130" height="80" fill="#e8f5e9" stroke="#66bb6a" stroke-width="2" rx="8"/>
  <text x="135" y="177" font-size="14" font-weight="bold" fill="#3d3229" text-anchor="middle">vec!</text>
  <text x="135" y="204" font-size="11" fill="#3d3229" text-anchor="middle">[1,2,3,4,5]</text>
  <line x1="200" y1="182" x2="255" y2="182" stroke="#5c4b37" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="255" y="142" width="130" height="80" fill="#fff3e0" stroke="#fb8c00" stroke-width="2" rx="8"/>
  <text x="320" y="182" font-size="12" font-weight="bold" fill="#3d3229" text-anchor="middle">iter()</text>
  <text x="320" y="204" font-size="11" fill="#666" text-anchor="middle">借用迭代</text>
  <line x1="385" y1="182" x2="440" y2="182" stroke="#5c4b37" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="440" y="142" width="130" height="80" fill="#e3f2fd" stroke="#42a5f5" stroke-width="2" rx="8"/>
  <text x="505" y="182" font-size="12" font-weight="bold" fill="#3d3229" text-anchor="middle">map(|x| x*x)</text>
  <text x="505" y="204" font-size="11" fill="#666" text-anchor="middle">惰性变换</text>
  <!-- 换行连接：从 map 底部绕到 filter 顶部 -->
  <path d="M 505 200 L 505 232 L 135 232 L 135 270" fill="none" stroke="#5c4b37" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 第二行：filter() → sum() -->
  <rect x="70" y="302" width="130" height="80" fill="#f3e5f5" stroke="#ab47bc" stroke-width="2" rx="8"/>
  <text x="135" y="342" font-size="12" font-weight="bold" fill="#3d3229" text-anchor="middle">filter(|x| *x&gt;5)</text>
  <text x="135" y="364" font-size="11" fill="#666" text-anchor="middle">惰性过滤</text>
  <line x1="200" y1="342" x2="255" y2="342" stroke="#5c4b37" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="255" y="302" width="130" height="80" fill="#ffebee" stroke="#ef5350" stroke-width="2" rx="8"/>
  <text x="320" y="342" font-size="12" font-weight="bold" fill="#3d3229" text-anchor="middle">sum()</text>
  <text x="320" y="364" font-size="11" fill="#666" text-anchor="middle">消费触发执行</text>
  <text x="320" y="424" font-size="12" fill="#5c4b37" text-anchor="middle">中间步骤只产生 Iterator 适配器，不分配新集合</text>
</svg>
