<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 364" width="520" height="364">
  <defs>
    <style>
      .bg { fill: #fff8f0; }
      .card { fill: #ffffff; stroke: #e0d6cc; stroke-width: 2; }
      .title { font: bold 22px system-ui, -apple-system, sans-serif; fill: #1a1a1a; }
      .text { font: 15px system-ui, -apple-system, sans-serif; fill: #2a2a2a; }
      .code { font: 14px "SF Mono", Menlo, monospace; fill: #3a2a1a; }
      .label { font: 13px system-ui, -apple-system, sans-serif; fill: #5a5a5a; }
      .arrow { stroke: #7a6a5a; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .highlight { fill: #ffeacc; stroke: #ffaa55; stroke-width: 2; }
      .box { fill: #e8f4ff; stroke: #3399ff; stroke-width: 2; }
      .box2 { fill: #f0ffe8; stroke: #66bb33; stroke-width: 2; }
      .box3 { fill: #fff0f5; stroke: #dd5599; stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7a6a5a"/>
    </marker>
  </defs>
  <rect width="520" height="364" class="bg"/>
  <rect x="16" y="16" width="488" height="332" rx="12" class="card"/>
  <text x="260" y="62" text-anchor="middle" class="title">🔒 RwLock 状态示意</text>
  <rect x="90" y="92" width="340" height="70" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" rx="8"/>
  <text x="260" y="122" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0d47a1">读共享状态</text>
  <text x="260" y="147" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#333">多个 read lock 同时持有 ✅ R1 ✅ R2 ✅ R3</text>
  <rect x="90" y="182" width="340" height="70" fill="#ffebee" stroke="#c62828" stroke-width="2" rx="8"/>
  <text x="260" y="212" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#b71c1c">写独占状态</text>
  <text x="260" y="237" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#333">write lock 独占 🔒 所有 reader / writer 等待</text>
  <path d="M 260 140 L 260 160" stroke="#666" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="260" y="302" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#666">不能同时存在 reader 和 writer</text>
</svg>
