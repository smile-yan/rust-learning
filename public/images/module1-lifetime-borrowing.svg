<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="392" viewBox="0 0 640 392">
  <defs>
    <style>
      .bg { fill: #fff8f0; }
      .card { fill: #ffffff; stroke: #e0d6cc; stroke-width: 2; }
      .title { font: bold 22px system-ui, -apple-system, sans-serif; fill: #1a1a1a; }
      .text { font: 15px system-ui, -apple-system, sans-serif; fill: #2a2a2a; }
      .code { font: 14px "SF Mono", Menlo, monospace; fill: #3a2a1a; }
      .label { font: 13px system-ui, -apple-system, sans-serif; fill: #5a5a5a; }
      .arrow { stroke: #7a6a5a; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .highlight { fill: #ffeacc; stroke: #ffaa55; stroke-width: 2; }
      .box { fill: #e8f4ff; stroke: #3399ff; stroke-width: 2; }
      .box2 { fill: #f0ffe8; stroke: #66bb33; stroke-width: 2; }
      .box3 { fill: #fff0f5; stroke: #dd5599; stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7a6a5a"/>
    </marker>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5c4b37"/>
    </marker>
  </defs>
  <rect width="640" height="392" class="bg"/>
  <rect x="16" y="16" width="608" height="360" rx="12" class="card"/>
  <text x="320" y="40" text-anchor="middle" class="title">生命周期：借用不能比拥有者活得更长</text>
  <text x="120" y="60" font-size="15" font-weight="bold" fill="#2e7d32" text-anchor="start">✅ 有效借用</text><rect x="70" y="85" width="240" height="70" fill="#e8f5e9" stroke="#66bb6a" stroke-width="2" rx="8"/><text x="190" y="115" font-size="12" font-weight="normal" fill="#3d3229" text-anchor="middle">let s = String::from(&quot;hello&quot;);</text><text x="190" y="145" font-size="11" font-weight="normal" fill="#666" text-anchor="middle">let r = &amp;s; // 在 s 有效期间借用</text><line x1="190" y1="155" x2="190" y2="215" stroke="#5c4b37" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="220" width="240" height="50" fill="#c8e6c9" stroke="#66bb6a" stroke-width="2" rx="8"/><text x="190" y="250" font-size="12" font-weight="normal" fill="#3d3229" text-anchor="middle">println!(&quot;{}&quot;, r); // OK</text><text x="410" y="60" font-size="15" font-weight="bold" fill="#c62828" text-anchor="start">⚠️ 无效借用（悬垂引用）</text><rect x="360" y="85" width="240" height="120" fill="#ffebee" stroke="#ef5350" stroke-width="2" rx="8"/><text x="480" y="115" font-size="14" font-weight="normal" fill="#3d3229" text-anchor="middle">{</text><text x="480" y="140" font-size="11" font-weight="normal" fill="#3d3229" text-anchor="middle">  let s = String::from(&quot;hi&quot;);</text><text x="480" y="165" font-size="11" font-weight="normal" fill="#3d3229" text-anchor="middle">  let r = &amp;s;</text><text x="480" y="190" font-size="11" font-weight="normal" fill="#3d3229" text-anchor="middle">} // s 在这里被释放</text><line x1="480" y1="205" x2="480" y2="250" stroke="#5c4b37" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="285" font-size="11" font-weight="normal" fill="#c62828" text-anchor="middle">println!(&quot;{}&quot;, r); // 编译错误！</text>
</svg>
