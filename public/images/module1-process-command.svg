<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="512" viewBox="0 0 640 512">
  <defs>
    <style>
      .bg { fill: #fff8f0; }
      .card { fill: #ffffff; stroke: #e0d6cc; stroke-width: 2; }
      .title { font: bold 22px system-ui, -apple-system, sans-serif; fill: #1a1a1a; }
      .text { font: 15px system-ui, -apple-system, sans-serif; fill: #2a2a2a; }
      .code { font: 14px "SF Mono", Menlo, monospace; fill: #3a2a1a; }
      .label { font: 13px system-ui, -apple-system, sans-serif; fill: #5a5a5a; }
      .arrow { stroke: #7a6a5a; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .highlight { fill: #ffeacc; stroke: #ffaa55; stroke-width: 2; }
      .box { fill: #e8f4ff; stroke: #3399ff; stroke-width: 2; }
      .box2 { fill: #f0ffe8; stroke: #66bb33; stroke-width: 2; }
      .box3 { fill: #fff0f5; stroke: #dd5599; stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7a6a5a"/>
    </marker>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5c4b37"/>
    </marker>
  </defs>
  <rect width="640" height="512" class="bg"/>
  <rect x="16" y="16" width="608" height="480" rx="12" class="card"/>
  <text x="320" y="62" text-anchor="middle" class="title">进程管理 std::process::Command</text>
  <rect x="40" y="78" width="560" height="404" fill="#fff3e0" stroke="#d4a76a" stroke-width="2" rx="8"/>
  <text x="320" y="108" font-size="14" font-weight="bold" fill="#3d3229" text-anchor="middle">Command 调用外部进程</text>
  <!-- Command::new -->
  <rect x="170" y="122" width="300" height="88" fill="#e8f5e9" stroke="#66bb6a" stroke-width="2" rx="8"/>
  <text x="320" y="146" font-size="13" font-weight="bold" fill="#3d3229" text-anchor="middle">Command::new</text>
  <text x="320" y="165" font-size="12" fill="#666" text-anchor="middle">Command::new("ls")</text>
  <text x="320" y="184" font-size="12" fill="#666" text-anchor="middle">.arg("-la")</text>
  <text x="320" y="203" font-size="12" fill="#666" text-anchor="middle">.env("KEY", "value")</text>
  <line x1="320" y1="210" x2="320" y2="242" stroke="#5c4b37" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 配置进程 -->
  <rect x="170" y="242" width="300" height="88" fill="#e3f2fd" stroke="#42a5f5" stroke-width="2" rx="8"/>
  <text x="320" y="266" font-size="13" font-weight="bold" fill="#3d3229" text-anchor="middle">配置进程</text>
  <text x="320" y="285" font-size="12" fill="#666" text-anchor="middle">stdin / stdout</text>
  <text x="320" y="304" font-size="12" fill="#666" text-anchor="middle">.spawn()</text>
  <text x="320" y="323" font-size="12" fill="#666" text-anchor="middle">.output()</text>
  <line x1="320" y1="330" x2="320" y2="362" stroke="#5c4b37" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Output 结果 -->
  <rect x="150" y="362" width="340" height="64" fill="#fce4ec" stroke="#ec407a" stroke-width="2" rx="8"/>
  <text x="320" y="386" font-size="13" font-weight="bold" fill="#3d3229" text-anchor="middle">Output 结果</text>
  <text x="320" y="406" font-size="12" fill="#666" text-anchor="middle">stdout · stderr · status（ExitStatus）</text>
  <text x="320" y="464" font-size="13" fill="#5c4b37" text-anchor="middle">spawn 异步执行，output 等待完成并捕获输出</text>
</svg>
