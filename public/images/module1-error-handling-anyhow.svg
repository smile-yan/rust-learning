<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="406" viewBox="0 0 640 406">
  <defs>
    <style>
      .bg { fill: #fff8f0; }
      .card { fill: #ffffff; stroke: #e0d6cc; stroke-width: 2; }
      .title { font: bold 22px system-ui, -apple-system, sans-serif; fill: #1a1a1a; }
      .text { font: 15px system-ui, -apple-system, sans-serif; fill: #2a2a2a; }
      .code { font: 14px "SF Mono", Menlo, monospace; fill: #3a2a1a; }
      .label { font: 13px system-ui, -apple-system, sans-serif; fill: #5a5a5a; }
      .arrow { stroke: #7a6a5a; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .highlight { fill: #ffeacc; stroke: #ffaa55; stroke-width: 2; }
      .box { fill: #e8f4ff; stroke: #3399ff; stroke-width: 2; }
      .box2 { fill: #f0ffe8; stroke: #66bb33; stroke-width: 2; }
      .box3 { fill: #fff0f5; stroke: #dd5599; stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7a6a5a"/>
    </marker>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5c4b37"/>
    </marker>
  </defs>
  <rect width="640" height="406" class="bg"/>
  <rect x="16" y="16" width="608" height="374" rx="12" class="card"/>
  <text x="320" y="62" text-anchor="middle" class="title">错误处理进阶 anyhow / thiserror</text>
  <rect x="40" y="77" width="560" height="290" fill="#fff3e0" stroke="#d4a76a" stroke-width="2" rx="8"/>
  <text x="320" y="107" font-size="14" font-weight="bold" fill="#3d3229" text-anchor="middle">错误处理分层</text>
  <rect x="60" y="132" width="180" height="88" fill="#e8f5e9" stroke="#66bb6a" stroke-width="2" rx="8"/>
  <text x="150" y="153" font-size="13" font-weight="bold" fill="#3d3229" text-anchor="middle">库代码 thiserror</text>
  <text x="150" y="173" font-size="12" fill="#666" text-anchor="middle">结构化错误类型</text>
  <text x="150" y="191" font-size="12" fill="#666" text-anchor="middle">#[derive(Error)]</text>
  <text x="150" y="209" font-size="12" fill="#666" text-anchor="middle">精确匹配错误变体</text>
  <line x1="240" y1="176" x2="290" y2="176" stroke="#5c4b37" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="260" y="151" width="140" height="50" fill="#fff3e0" stroke="#fb8c00" stroke-width="2" rx="8"/>
  <text x="330" y="173" font-size="12" fill="#5c4b37" text-anchor="middle">? 传播</text>
  <text x="330" y="191" font-size="12" fill="#5c4b37" text-anchor="middle">自动转换</text>
  <line x1="400" y1="176" x2="450" y2="176" stroke="#5c4b37" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="450" y="132" width="130" height="88" fill="#e3f2fd" stroke="#42a5f5" stroke-width="2" rx="8"/>
  <text x="515" y="153" font-size="13" font-weight="bold" fill="#3d3229" text-anchor="middle">应用代码 anyhow</text>
  <text x="515" y="173" font-size="12" fill="#666" text-anchor="middle">统一错误类型</text>
  <text x="515" y="191" font-size="12" fill="#666" text-anchor="middle">Context + 背景链</text>
  <text x="515" y="209" font-size="12" fill="#666" text-anchor="middle">.context("msg")?</text>
  <line x1="330" y1="220" x2="330" y2="254" stroke="#5c4b37" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="200" y="258" width="260" height="50" fill="#fce4ec" stroke="#ec407a" stroke-width="2" rx="8"/>
  <text x="330" y="281" font-size="13" font-weight="bold" fill="#3d3229" text-anchor="middle">用户看到的信息</text>
  <text x="330" y="301" font-size="12" fill="#666" text-anchor="middle">可读的错误链 + 上下文 + 原始错误</text>
  <text x="320" y="348" font-size="13" fill="#5c4b37" text-anchor="middle">thiserror 定义类型，anyhow 在应用中统一处理</text>
</svg>
