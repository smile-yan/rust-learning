<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <defs>
    <style>
      .bg { fill: #fff8f0; }
      .card { fill: #ffffff; stroke: #e0d6cc; stroke-width: 2; }
      .title { font: bold 22px system-ui, -apple-system, sans-serif; fill: #1a1a1a; }
      .text { font: 15px system-ui, -apple-system, sans-serif; fill: #2a2a2a; }
      .code { font: 14px "SF Mono", Menlo, monospace; fill: #3a2a1a; }
      .label { font: 13px system-ui, -apple-system, sans-serif; fill: #5a5a5a; }
      .arrow { stroke: #7a6a5a; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .highlight { fill: #ffeacc; stroke: #ffaa55; stroke-width: 2; }
      .box { fill: #e8f4ff; stroke: #3399ff; stroke-width: 2; }
      .box2 { fill: #f0ffe8; stroke: #66bb33; stroke-width: 2; }
      .box3 { fill: #fff0f5; stroke: #dd5599; stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7a6a5a"/>
    </marker>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5c4b37"/>
    </marker>
  </defs>
  <rect width="640" height="360" class="bg"/>
  <rect x="16" y="16" width="608" height="328" rx="12" class="card"/>
  <text x="320" y="40" text-anchor="middle" class="title">Trait Bounds：能力组合</text>
  <rect x="120" y="55" width="400" height="80" fill="#fff3e0" stroke="#fb8c00" stroke-width="2" rx="8"/>
  <text x="320" y="90" font-size="15" font-weight="bold" fill="#3d3229" text-anchor="middle">fn notify&lt;T: Summary + Display&gt;(item: &amp;T)</text>
  <text x="320" y="120" font-size="13" font-weight="normal" fill="#666" text-anchor="middle">类型 T 必须同时实现 Summary 和 Display</text>

  <text x="320" y="158" font-size="15" font-weight="normal" fill="#5c4b37" text-anchor="middle">Trait Bounds：组合多个能力</text>

  <rect x="120" y="170" width="180" height="80" fill="#e8f5e9" stroke="#66bb6a" stroke-width="2" rx="8"/>
  <text x="210" y="200" font-size="14" font-weight="bold" fill="#3d3229" text-anchor="middle">Summary</text>
  <text x="210" y="220" font-size="12" font-weight="normal" fill="#3d3229" text-anchor="middle">summarize()</text>

  <rect x="340" y="170" width="180" height="80" fill="#e3f2fd" stroke="#42a5f5" stroke-width="2" rx="8"/>
  <text x="430" y="200" font-size="14" font-weight="bold" fill="#3d3229" text-anchor="middle">Display</text>
  <text x="430" y="220" font-size="12" font-weight="normal" fill="#3d3229" text-anchor="middle">to_string()</text>

  <rect x="230" y="280" width="180" height="50" fill="#ffe0b2" stroke="#fb8c00" stroke-width="2" rx="8"/>
  <text x="320" y="310" font-size="12" font-weight="bold" fill="#3d3229" text-anchor="middle">T 必须同时满足</text>

  <line x1="240" y1="250" x2="240" y2="280" stroke="#5c4b37" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="250" x2="400" y2="280" stroke="#5c4b37" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
