<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390" role="img" aria-label="栈与堆的内存布局">
  <defs>
    <style>
      .bg { fill: #fff8f0; }
      .card { fill: #ffffff; stroke: #e0d6cc; stroke-width: 2; }
      .title { font: bold 22px system-ui, -apple-system, sans-serif; fill: #1a1a1a; }
      .text { font: 15px system-ui, -apple-system, sans-serif; fill: #2a2a2a; }
      .code { font: 14px "SF Mono", Menlo, monospace; fill: #3a2a1a; }
      .label { font: 13px system-ui, -apple-system, sans-serif; fill: #5a5a5a; }
      .arrow { stroke: #7a6a5a; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .highlight { fill: #ffeacc; stroke: #ffaa55; stroke-width: 2; }
      .box { fill: #e8f4ff; stroke: #3399ff; stroke-width: 2; }
      .box2 { fill: #f0ffe8; stroke: #66bb33; stroke-width: 2; }
      .box3 { fill: #fff0f5; stroke: #dd5599; stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7a6a5a"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#d9534f"/>
    </marker>
  </defs>
  <title>栈与堆的内存布局</title>
  <rect width="720" height="412" class="bg"/>
  <rect x="16" y="16" width="688" height="380" rx="12" class="card"/>
  <text x="360" y="62" text-anchor="middle" class="title">📦 栈与堆的内存布局</text>
  <rect x="40" y="82" width="280" height="280" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" rx="8"/>
  <text x="180" y="110" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#0d47a1">栈 Stack</text>
  <text x="180" y="130" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#555">自动管理、LIFO、速度快</text>

  <rect x="70" y="152" width="250" height="36" fill="#ffffff" stroke="#1565c0" stroke-width="1.5" rx="4"/>
  <text x="195" y="175" text-anchor="middle" font-family="monospace" font-size="13" fill="#333">x: i32 = 5</text>

  <rect x="70" y="197" width="250" height="36" fill="#ffffff" stroke="#1565c0" stroke-width="1.5" rx="4"/>
  <text x="195" y="220" text-anchor="middle" font-family="monospace" font-size="13" fill="#333">y: bool = true</text>

  <rect x="70" y="242" width="250" height="36" fill="#ffffff" stroke="#1565c0" stroke-width="1.5" rx="4"/>
  <text x="195" y="265" text-anchor="middle" font-family="monospace" font-size="13" fill="#333">String struct (ptr/len/cap)</text>

  <rect x="70" y="287" width="250" height="36" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="4,2" rx="4"/>
  <text x="195" y="310" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#0d47a1">main() 栈帧</text>

  <rect x="380" y="82" width="300" height="280" fill="#fff3e0" stroke="#ef6c00" stroke-width="2" rx="8"/>
  <text x="530" y="110" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#e65100">堆 Heap</text>
  <text x="530" y="130" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#555">动态分配、生命周期复杂</text>

  <rect x="410" y="152" width="240" height="50" fill="#ffffff" stroke="#ef6c00" stroke-width="1.5" rx="4"/>
  <text x="530" y="172" text-anchor="middle" font-family="monospace" font-size="13" fill="#333">String 实际内容</text>
  <text x="530" y="192" text-anchor="middle" font-family="monospace" font-size="13" fill="#333">&quot;hello, Rust&quot;</text>

  <rect x="410" y="222" width="240" height="50" fill="#ffffff" stroke="#ef6c00" stroke-width="1.5" rx="4"/>
  <text x="530" y="242" text-anchor="middle" font-family="monospace" font-size="13" fill="#333">Vec 元素</text>
  <text x="530" y="262" text-anchor="middle" font-family="monospace" font-size="13" fill="#333">[1, 2, 3]</text>

  <path d="M 320 238 L 410 155" stroke="#d9534f" stroke-width="2" marker-end="url(#arrow-red)" fill="none"/>
  <text x="340" y="207" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#d9534f">ptr 指向</text>

  <text x="180" y="387" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#0d47a1">✅ 固定大小、编译期确定 → 栈</text>
  <text x="530" y="387" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#e65100">⚠️ 动态大小、运行时分配 → 堆</text>
</svg>
