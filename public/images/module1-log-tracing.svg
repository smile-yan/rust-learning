<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380">
  <defs>
    <style>
      .bg { fill: #fff8f0; }
      .card { fill: #ffffff; stroke: #e0d6cc; stroke-width: 2; }
      .title { font: bold 22px system-ui, -apple-system, sans-serif; fill: #1a1a1a; }
      .text { font: 15px system-ui, -apple-system, sans-serif; fill: #2a2a2a; }
      .code { font: 14px "SF Mono", Menlo, monospace; fill: #3a2a1a; }
      .label { font: 13px system-ui, -apple-system, sans-serif; fill: #5a5a5a; }
      .arrow { stroke: #7a6a5a; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .highlight { fill: #ffeacc; stroke: #ffaa55; stroke-width: 2; }
      .box { fill: #e8f4ff; stroke: #3399ff; stroke-width: 2; }
      .box2 { fill: #f0ffe8; stroke: #66bb33; stroke-width: 2; }
      .box3 { fill: #fff0f5; stroke: #dd5599; stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7a6a5a"/>
    </marker>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5c4b37"/>
    </marker>
  </defs>
  <rect width="640" height="380" class="bg"/>
  <rect x="16" y="16" width="608" height="348" rx="12" class="card"/>
  <text x="320" y="40" text-anchor="middle" class="title">日志系统 log / tracing</text>
  <rect x="40" y="56" width="560" height="282" fill="#fff3e0" stroke="#d4a76a" stroke-width="2" rx="8"/>
  <text x="320" y="86" font-size="14" font-weight="bold" fill="#3d3229" text-anchor="middle">日志分层架构</text>
  <rect x="60" y="110" width="120" height="65" fill="#e8f5e9" stroke="#66bb6a" stroke-width="2" rx="8"/>
  <text x="120" y="135" font-size="13" font-weight="bold" fill="#3d3229" text-anchor="middle">应用代码</text>
  <text x="120" y="155" font-size="12" fill="#666" text-anchor="middle">log::info!</text>
  <text x="120" y="170" font-size="12" fill="#666" text-anchor="middle">tracing::span!</text>
  <line x1="180" y1="142" x2="240" y2="142" stroke="#5c4b37" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="250" y="110" width="140" height="85" fill="#e3f2fd" stroke="#42a5f5" stroke-width="2" rx="8"/>
  <text x="320" y="135" font-size="13" font-weight="bold" fill="#3d3229" text-anchor="middle">log / tracing</text>
  <text x="320" y="155" font-size="12" fill="#666" text-anchor="middle">Facade 层</text>
  <text x="320" y="172" font-size="12" fill="#666" text-anchor="middle">Filter / Level</text>
  <text x="320" y="188" font-size="12" fill="#666" text-anchor="middle">Record 结构</text>
  <line x1="320" y1="195" x2="320" y2="232" stroke="#5c4b37" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="170" y="236" width="300" height="55" fill="#fce4ec" stroke="#ec407a" stroke-width="2" rx="8"/>
  <text x="320" y="261" font-size="13" font-weight="bold" fill="#3d3229" text-anchor="middle">Subscriber 实现</text>
  <text x="320" y="281" font-size="12" fill="#666" text-anchor="middle">env_logger · tracing_subscriber · 自定义格式</text>
  <line x1="390" y1="142" x2="450" y2="142" stroke="#5c4b37" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="460" y="110" width="120" height="65" fill="#e8f5e9" stroke="#66bb6a" stroke-width="2" rx="8"/>
  <text x="520" y="135" font-size="13" font-weight="bold" fill="#3d3229" text-anchor="middle">输出目标</text>
  <text x="520" y="155" font-size="12" fill="#666" text-anchor="middle">终端 / 文件</text>
  <text x="520" y="170" font-size="12" fill="#666" text-anchor="middle">JSON / syslog</text>
  <text x="320" y="320" font-size="13" fill="#5c4b37" text-anchor="middle">log 是轻量 Facade，tracing 是结构化可观测方案</text>
</svg>
