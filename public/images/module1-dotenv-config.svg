<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="384" viewBox="0 0 640 384">
  <defs>
    <style>
      .bg { fill: #fff8f0; }
      .card { fill: #ffffff; stroke: #e0d6cc; stroke-width: 2; }
      .title { font: bold 22px system-ui, -apple-system, sans-serif; fill: #1a1a1a; }
      .text { font: 15px system-ui, -apple-system, sans-serif; fill: #2a2a2a; }
      .code { font: 14px "SF Mono", Menlo, monospace; fill: #3a2a1a; }
      .label { font: 13px system-ui, -apple-system, sans-serif; fill: #5a5a5a; }
      .arrow { stroke: #7a6a5a; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .highlight { fill: #ffeacc; stroke: #ffaa55; stroke-width: 2; }
      .box { fill: #e8f4ff; stroke: #3399ff; stroke-width: 2; }
      .box2 { fill: #f0ffe8; stroke: #66bb33; stroke-width: 2; }
      .box3 { fill: #fff0f5; stroke: #dd5599; stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7a6a5a"/>
    </marker>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5c4b37"/>
    </marker>
  </defs>
  <rect width="640" height="384" class="bg"/>
  <rect x="16" y="16" width="608" height="352" rx="12" class="card"/>
  <text x="320" y="40" text-anchor="middle" class="title">环境变量与配置 dotenv / config</text>
  <rect x="40" y="56" width="560" height="286" fill="#fff3e0" stroke="#d4a76a" stroke-width="2" rx="8"/>
  <text x="320" y="86" font-size="14" font-weight="bold" fill="#3d3229" text-anchor="middle">应用配置加载流程</text>
  <rect x="60" y="110" width="130" height="78" fill="#e8f5e9" stroke="#66bb6a" stroke-width="2" rx="8"/>
  <text x="125" y="132" font-size="13" font-weight="bold" fill="#3d3229" text-anchor="middle">.env 文件</text>
  <text x="125" y="152" font-size="11" fill="#666" text-anchor="middle">DATABASE_URL=...</text>
  <text x="125" y="170" font-size="11" fill="#666" text-anchor="middle">PORT=8080</text>
  <line x1="190" y1="149" x2="230" y2="149" stroke="#5c4b37" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="240" y="110" width="140" height="78" fill="#e3f2fd" stroke="#42a5f5" stroke-width="2" rx="8"/>
  <text x="310" y="132" font-size="13" font-weight="bold" fill="#3d3229" text-anchor="middle">dotenv::dotenv</text>
  <text x="310" y="152" font-size="12" fill="#666" text-anchor="middle">加载到 std::env</text>
  <text x="310" y="170" font-size="12" fill="#666" text-anchor="middle">优先级低于系统 env</text>
  <line x1="380" y1="149" x2="420" y2="149" stroke="#5c4b37" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="430" y="110" width="150" height="78" fill="#fce4ec" stroke="#ec407a" stroke-width="2" rx="8"/>
  <text x="505" y="132" font-size="13" font-weight="bold" fill="#3d3229" text-anchor="middle">Config 结构体</text>
  <text x="505" y="152" font-size="12" fill="#666" text-anchor="middle">env::var("PORT")</text>
  <text x="505" y="170" font-size="12" fill="#666" text-anchor="middle">unwrap_or("8080")</text>
  <line x1="310" y1="188" x2="310" y2="228" stroke="#5c4b37" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="170" y="232" width="280" height="60" fill="#e8f5e9" stroke="#66bb6a" stroke-width="2" rx="8"/>
  <text x="310" y="256" font-size="13" font-weight="bold" fill="#3d3229" text-anchor="middle">config crate（可选）</text>
  <text x="310" y="278" font-size="12" fill="#666" text-anchor="middle">YAML / TOML / JSON 多层配置合并</text>
  <text x="320" y="320" font-size="13" fill="#5c4b37" text-anchor="middle">dotenv 隔离开发环境，config crate 管理多环境配置</text>
</svg>
